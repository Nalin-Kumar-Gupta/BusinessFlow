name = "businessflow"
main = "src/worker.ts"
compatibility_date = "2026-09-02"

[vars]
APP_ENV = "local"
API_VERSION = "v1"
LOG_LEVEL = "info"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5173"
AUTH_PROVIDER = "supabase"
SUPABASE_URL = "https://REPLACE_PROJECT_REF.supabase.co"
SUPABASE_ANON_KEY = "REPLACE_SUPABASE_ANON_KEY"
SUPABASE_PUBLISHABLE_KEY = "REPLACE_SUPABASE_PUBLISHABLE_KEY"
SUPABASE_SECRET_KEY = "REPLACE_SUPABASE_SECRET_KEY"
SUPABASE_JWKS_URL = "https://REPLACE_PROJECT_REF.supabase.co/auth/v1/.well-known/jwks.json"
SESSION_COOKIE_NAME = "bf_session"
SESSION_TTL_SECONDS = "2592000"
SESSION_ENCRYPTION_KEY = "REPLACE_BASE64_32_BYTE_KEY"
PADDLE_ENV = "sandbox"
PADDLE_API_BASE_URL = "https://sandbox-api.paddle.com"
PADDLE_API_KEY = "REPLACE_PADDLE_SANDBOX_API_KEY"
PADDLE_CLIENT_TOKEN = "test_REPLACE_PADDLE_SANDBOX_CLIENT_TOKEN"
PADDLE_WEBHOOK_SECRET = "REPLACE_PADDLE_SANDBOX_WEBHOOK_SECRET"
PADDLE_PRICE_IDS_JSON = "{\"starter-monthly\":\"pri_starter_monthly\",\"starter-yearly\":\"pri_starter_yearly\",\"pro-monthly\":\"pri_pro_monthly\",\"pro-yearly\":\"pri_pro_yearly\",\"advanced-monthly\":\"pri_advanced_monthly\",\"advanced-yearly\":\"pri_advanced_yearly\"}"
PADDLE_PRODUCT_IDS_JSON = "{\"starter\":\"pro_starter\",\"pro\":\"pro_pro\",\"advanced\":\"pro_advanced\"}"
PADDLE_CHECKOUT_SUCCESS_URL = "http://localhost:3000/billing/success"
PADDLE_CHECKOUT_CANCEL_URL = "http://localhost:3000/billing/cancel"
ENTITLEMENT_REFRESH_INTERVAL_SECONDS = "300"
ENTITLEMENT_CACHE_MAX_AGE_SECONDS = "900"
ENTITLEMENT_OFFLINE_GRACE_SECONDS = "900"

[[d1_databases]]
binding = "DB"
database_name = "businessflow_local"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

