<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BusinessFlow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background:
        radial-gradient(960px 420px at -12% -16%, rgba(37, 99, 235, 0.10), transparent 64%),
        radial-gradient(860px 360px at 112% -10%, rgba(16, 185, 129, 0.07), transparent 62%),
        #f3f6fb;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #0f172a;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow-y: auto;
    }

    :where(button, input, select, textarea, [tabindex]):focus-visible {
      outline: 3px solid #1d4ed8;
      outline-offset: 2px;
    }

    /* ── Outer card ── */
    .tt-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08), 0 2px 10px rgba(15, 23, 42, 0.05);
      border: 1px solid #dbe3ef;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Header ── */
    .tt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .tt-brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .tt-brand-icon {
      width: 30px;
      height: 30px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    .tt-brand-copy {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 1.1;
    }

    .tt-brand-copy strong {
      font-size: 0.93rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #0f172a;
    }

    .tt-brand-copy span {
      font-size: 0.68rem;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .tt-header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-left: auto;
    }

    .tt-header--recording {
      margin-bottom: 4px;
    }


    .tt-inner { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
    .tt-inner--sm { padding: 10px 12px; }

    /* ── Inputs ── */
    .tt-input {
      width: 100%;
      background: #f4f5f3;
      border: 1px solid #d8d9d6;
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      font-family: inherit;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .tt-input:focus { border-color: #666; background: white; }
    .tt-input::placeholder { color: #aaa; }

    /* ── Origin chip ── */
    .origin-chip {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.78rem; color: #555;
      padding: 0.5rem 0.75rem;
      background: #f0f1ef;
      border-radius: 9999px;
      border: 1px solid #d8d9d6;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .origin-dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf7d; flex-shrink: 0; }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      min-height: 44px;
      padding: 0.72rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.16s ease, transform 0.12s ease, box-shadow 0.16s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: -.01em;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.24);
    }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; box-shadow: 0 10px 20px rgba(37, 99, 235, 0.28); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      min-height: 38px;
      padding: 0.62rem;
      background: #fff;
      color: #334155;
      border: 1px solid #d5dfec;
      border-radius: 10px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-secondary:hover { background: #f8fafc; border-color: #c4d0df; }
    .btn-secondary__content {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary__content svg {
      width: 13px;
      height: 13px;
      color: #6b7280;
      flex-shrink: 0;
    }

    .btn-account {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #c9d8ee;
      background: #fff;
      color: #1e3a68;
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
    }
    .btn-account:hover { background: #f7fbff; border-color: #a8c0e6; box-shadow: 0 2px 7px rgba(29, 78, 216, 0.12); }
    .btn-account:active { transform: translateY(1px); }
    .btn-account:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }

    .btn-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: #4b5563;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-icon:hover {
      background: #ffffff;
      border-color: #d0d0ce;
      color: #111827;
    }
    .btn-icon:disabled,
    .pending-btn:disabled,
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-icon svg {
      width: 16px;
      height: 16px;
      display: block;
    }


    .capture-row { margin-bottom: 0.5rem; }

    /* ── Recording controls (hero capture + secondary + cancel) ── */
    .recording-controls {
      margin-top: 4px;
      padding: 14px;
      border: 1px solid #d8e2f0;
      border-radius: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
    }

    .rec-capture-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      padding: 0.9rem 1rem;
      background: linear-gradient(180deg, #1e4fd6 0%, #163fae 100%);
      color: #ffffff;
      border: 1px solid #1e40af;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 750;
      font-family: inherit;
      letter-spacing: -0.005em;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(29, 78, 216, 0.27);
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }
    .rec-capture-btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #1a46be 0%, #15378f 100%);
      box-shadow: 0 14px 24px rgba(29, 78, 216, 0.32);
    }
    .rec-capture-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 5px 12px rgba(29, 78, 216, 0.24); }
    .rec-capture-btn:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
    .rec-capture-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .rec-capture-support {
      margin: -1px 2px 0;
      font-size: 0.74rem;
      color: #64748b;
      line-height: 1.45;
    }

    .rec-capture-feedback {
      border-radius: 9px;
      border: 1px solid #d8e2f0;
      background: #f4f7fc;
      color: #5b6b84;
      font-size: 0.74rem;
      line-height: 1.45;
      padding: 7px 10px;
    }
    .rec-capture-feedback.is-done {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }
    .rec-capture-feedback.is-failed {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }
    .rec-capture-feedback.is-capturing {
      border-color: #bfdbfe;
      background: #eff6ff;
      color: #1e40af;
    }

    .rec-secondary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .rec-secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 0.52rem 0.7rem;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #d8e2f0;
      border-radius: 10px;
      font-size: 0.81rem;
      font-weight: 650;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .rec-secondary-btn:hover:not(:disabled) { background: #f4f7fc; border-color: #bfd0e5; }
    .rec-secondary-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .rec-secondary-btn svg { width: 13px; height: 13px; flex-shrink: 0; color: #64748b; }

    .rec-secondary-btn--danger {
      border-color: #fecaca;
      color: #991b1b;
      background: #fff;
    }
    .rec-secondary-btn--danger svg { color: #b91c1c; }
    .rec-secondary-btn--danger:hover:not(:disabled) {
      background: #fef2f2;
      border-color: #fda4af;
    }

    .rec-cancel-link {
      align-self: center;
      margin-top: 2px;
      background: transparent;
      border: none;
      color: #b91c1c;
      font-size: 0.73rem;
      font-weight: 600;
      font-family: inherit;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .rec-cancel-link:hover:not(:disabled) { background: #fef2f2; color: #991b1b; }
    .rec-cancel-link:disabled { opacity: 0.5; cursor: not-allowed; }

    .recording-meta {
      margin-top: 2px;
      border-radius: 12px;
      border: 1px solid #dbe4f0;
      background: #f8fafc;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .recording-meta__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .recording-meta__item {
      border: 1px solid #dbe4f0;
      background: #ffffff;
      border-radius: 10px;
      padding: 8px 9px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .recording-meta__label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .recording-meta__item strong {
      font-size: 0.86rem;
      color: #0f172a;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .recording-meta__pending {
      border: 1px solid #fcd34d;
      background: #fffbeb;
      color: #92400e;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .recording-meta__pending-title {
      font-size: 0.72rem;
      font-weight: 700;
    }

    .recording-meta__pending-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.71rem;
      color: #78350f;
    }

    .recording-meta__pending-row span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recording-meta__allow {
      border: 1px solid #d97706;
      background: #d97706;
      color: white;
      border-radius: 999px;
      font-size: 0.69rem;
      font-weight: 700;
      font-family: inherit;
      padding: 3px 9px;
      cursor: pointer;
      white-space: nowrap;
    }
    .recording-meta__allow:hover { background: #b45309; border-color: #b45309; }

    .recording-meta__foot {
      font-size: 0.72rem;
      color: #475569;
      line-height: 1.4;
    }
    .recording-meta__foot span {
      color: #0f172a;
      font-weight: 600;
    }

    @media (max-width: 380px) {
      .rec-secondary-row { grid-template-columns: 1fr; }
      .recording-meta__grid { grid-template-columns: 1fr; }
    }

    /* ── Empty / no permission ── */
    .empty {
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 30px 12px;
    }
    .empty-icon {
      width: 60px; height: 60px;
      background: white;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.9rem;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      margin-bottom: 4px;
    }
    .empty-title { font-size: 1.15rem; font-weight: 800; letter-spacing: -.02em; color: #1a1a1a; }
    .empty-sub { font-size: 0.8rem; color: #666; line-height: 1.5; max-width: 260px; }

    /* ── SLA row ── */
    .sla-row {
      background: white; border-radius: 12px;
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
      margin-bottom: 10px;
    }
    .sla-toggle-label {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; user-select: none;
    }
    .sla-toggle-track {
      position: relative; width: 36px; height: 20px; flex-shrink: 0;
    }
    .sla-checkbox { opacity: 0; width: 0; height: 0; position: absolute; }
    .sla-knob {
      position: absolute; inset: 0; border-radius: 20px;
      background: #d0d0ce; transition: background .2s; cursor: pointer;
    }
    .sla-knob::after {
      content: ''; position: absolute;
      width: 14px; height: 14px; border-radius: 50%;
      background: white; top: 3px; left: 3px;
      transition: transform .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
    }
    .sla-checkbox:checked ~ .sla-knob { background: #f0ff7a; border: 1px solid #cce000; }
    .sla-checkbox:checked ~ .sla-knob::after { transform: translateX(16px); }
    .sla-label-text { font-size: 0.85rem; font-weight: 600; color: #333; }
    .sla-slider-wrap { display: flex; align-items: center; gap: 10px; padding-left: 2px; }
    .sla-slider { flex: 1; height: 4px; accent-color: #1a1a1a; cursor: pointer; }
    .sla-value { font-size: 0.85rem; font-weight: 700; color: #1a1a1a; min-width: 24px; text-align: right; }

    /* ── Pending origins panel ── */
    .pending-block {
      background: white; border-left: 3px solid #e67e22;
      border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
    }
    .pending-title { font-size: 0.75rem; font-weight: 700; color: #8a4500; margin-bottom: 8px; }
    .pending-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .pending-origin {
      flex: 1; font-size: 0.72rem; color: #555;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pending-btn {
      font-size: 0.72rem; padding: 3px 10px;
      background: #e67e22; color: white; border: none; border-radius: 12px;
      cursor: pointer; white-space: nowrap; font-family: inherit;
    }

    /* ── Live step feed ── */
    .step-feed {
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #dbe4f0;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .step-feed__head {
      font-size: 0.78rem;
      font-weight: 700;
      color: #555;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .step-feed__list {
      max-height: 208px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }
    .step-feed__empty {
      font-size: 0.75rem;
      color: #64748b;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #dbe4f0;
    }
    .step-card {
      border: 1px solid #dce4ef;
      border-radius: 10px;
      padding: 8px;
      background: #f8fafc;
    }
    .step-card__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
    }
    .step-card__title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #1f1f1f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .step-card__index {
      font-size: 0.68rem;
      color: #888;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .step-card__meta {
      font-size: 0.7rem;
      color: #64748b;
      margin-bottom: 6px;
    }
    .step-card__footer {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .step-card__pair {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .step-card__pair-arrow {
      font-size: 0.7rem;
      color: #8a8a88;
      font-weight: 700;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    .step-card__pair-arrow::before {
      content: '->';
    }
    .step-card__frame {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .step-card__frame--single {
      width: 100%;
    }
    .step-card__frame-label {
      font-size: 0.58rem;
      color: #737370;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .step-card__thumb {
      width: 58px;
      height: 38px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid #d7d7d5;
      background: #efefee;
      flex-shrink: 0;
    }
    .step-card__thumb--empty {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      color: #999;
    }
    .step-card__badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .step-transition-badge {
      margin-top: 6px;
      background: #f4f4f5;
      border-color: #d4d4d8;
      color: #52525b;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0;
    }
    .step-card__saved-note {
      margin-top: 7px;
      font-size: 0.72rem;
      color: #3b3b39;
      background: #f2f3f0;
      border-radius: 8px;
      padding: 6px 8px;
      border: 1px solid #e3e3e1;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .step-card__note-actions {
      margin-top: 7px;
      display: flex;
      justify-content: flex-end;
    }
    .step-note-btn {
      font-size: 0.68rem;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid #d3d3d1;
      background: white;
      color: #444;
      padding: 3px 9px;
      cursor: pointer;
      font-family: inherit;
    }
    .step-note-btn:hover { background: #f4f4f3; }
    .step-card__editor {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .step-card__note-input {
      width: 100%;
      resize: vertical;
      min-height: 50px;
      border-radius: 8px;
      border: 1px solid #d7d7d5;
      padding: 7px 8px;
      font-size: 0.74rem;
      font-family: inherit;
      color: #1f1f1f;
      background: white;
      outline: none;
    }
    .step-card__note-input:focus { border-color: #9a9a97; }
    .step-note-save {
      align-self: flex-end;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #d3d3d1;
      background: #1f1f1f;
      color: white;
      padding: 4px 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .step-note-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .step-badge {
      font-size: 0.62rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 2px 7px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .step-badge--err {
      color: #8b0000;
      background: #ffe9e9;
      border-color: #f4b8b8;
    }
    .step-badge--warn {
      color: #8a4500;
      background: #fff3e0;
      border-color: #f0d19e;
    }

    .err  { font-size: 0.78rem; color: #e94560; padding: 6px 4px; }
    .retention-warning {
      margin-bottom: 10px;
      border: 1px solid #fcd34d;
      background: #fffbeb;
      color: #92400e;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.74rem;
      line-height: 1.45;
    }
    .panel-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4000;
      padding: 14px;
    }
    .panel-modal {
      width: min(420px, calc(100vw - 28px));
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-modal__title { font-size: 0.9rem; font-weight: 700; color: #0f172a; }
    .panel-modal__body { margin: 0; font-size: 0.8rem; color: #334155; line-height: 1.5; }
    .panel-modal__actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .panel-modal__actions--stacked {
      flex-direction: column;
      align-items: stretch;
    }
    .hint { font-size: 0.72rem; color: #999; text-align: center; line-height: 1.4; }
    kbd  {
      font-family: inherit;
      background: rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 5px;
      padding: 1px 5px;
      font-size: 0.7rem;
    }
    .mt { margin-top: 0.6rem; }
    .mb { margin-bottom: 0.6rem; }
    .row { display: flex; gap: 0.6rem; }
    .row--center { justify-content: center; }

    .recording-status-strip {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      border-radius: 12px;
      border: 1px solid #d6e2f1;
      background: linear-gradient(90deg, #eff6ff 0%, #f8fbff 100%);
      padding: 10px 11px;
      margin-bottom: 8px;
    }
    .recording-status-strip--active { border-color: #fbcfe8; background: #fff8fb; }
    .recording-status-strip--paused { border-color: #fde68a; background: #fffbeb; }
    .recording-status-strip--stopping { border-color: #bfdbfe; background: #eff6ff; }
    .recording-status-strip--idle { border-color: #dbe4f0; background: #f8fafc; }
    .recording-status-strip__dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .recording-status-strip__dot.is-active { background: #e11d48; animation: recBlink 1.4s ease-in-out infinite; }
    .recording-status-strip__dot.is-paused { background: #f59e0b; }
    .recording-status-strip__dot.is-stopping { background: #2563eb; animation: recBlink 0.9s ease-in-out infinite; }
    .recording-status-strip__dot.is-idle { background: #94a3b8; }
    .recording-status-strip__copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .recording-status-strip__copy strong {
      font-size: 0.76rem;
      color: #0f172a;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .recording-status-strip__copy span {
      font-size: 0.7rem;
      color: #475569;
      line-height: 1.35;
    }
    .recording-status-strip__timer {
      font-size: 0.74rem;
      font-weight: 700;
      color: #334155;
      font-variant-numeric: tabular-nums;
      border-radius: 999px;
      border: 1px solid #dbe4f0;
      background: #f8fafc;
      padding: 2px 8px;
    }

    .loading-state-card {
      align-items: center;
      justify-content: center;
      min-height: 140px;
      gap: 10px;
    }
    .loading-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2563eb;
      animation: recBlink 1.1s ease-in-out infinite;
    }
    .loading-copy {
      margin: 0;
      font-size: 0.83rem;
      color: #64748b;
      font-weight: 600;
    }

    .helper-text {
      color: var(--fg-muted, #64748b);
      text-align: center;
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.5;
    }

    @keyframes recBlink { 0%,100%{opacity:1} 50%{opacity:.25} }
  </style>
  <link rel="stylesheet" href="../shared/theme.css" />
</head>
<body>
  <div id="root"></div>
  <script src="panel.js"></script>
</body>
</html>
